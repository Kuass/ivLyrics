name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Exercise the next Ubuntu image before ubuntu-latest migrates.
        # https://github.com/actions/runner-images/issues/14748
        os: [ubuntu-latest, ubuntu-26.04, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          # Differential regressions read baseline sources from earlier commits.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate bundle, installer, versions and regression tests
        run: node scripts/check.mjs
      - name: Check patch whitespace
        run: git diff --check
